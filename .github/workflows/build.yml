name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.7/bin" >> $GITHUB_PATH
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CamMax.apk
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" verify --verbose --print-certs CamMax.apk
          "$BT/aapt2" dump badging CamMax.apk | head -20
          ls -l CamMax.apk
          sha256sum CamMax.apk
      - name: Build install-test variants
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          gradle assembleDebug --no-daemon -PdebugKey -PidSuffix=.testb
          cp app/build/outputs/apk/debug/app-debug.apk CamMax-test-B.apk
          git worktree add old 9f26819
          cp app/build.gradle.kts old/app/build.gradle.kts
          cp cammax.p12 old/cammax.p12
          (cd old && gradle assembleDebug --no-daemon -PidSuffix=.testa)
          cp old/app/build/outputs/apk/debug/app-debug.apk CamMax-test-A.apk
          for f in CamMax-test-A.apk CamMax-test-B.apk; do "$BT/apksigner" verify --print-certs $f | head -3; ls -l $f; done
      - uses: actions/upload-artifact@v4
        with:
          name: CamMax-debug-apk
          path: CamMax.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CamMax build ${{ github.run_number }}
          files: |
            CamMax.apk
            CamMax-test-A.apk
            CamMax-test-B.apk
          make_latest: true
